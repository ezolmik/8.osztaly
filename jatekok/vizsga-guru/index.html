<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="A Radnóti nyolcadikos matematikavizsgájának témái tanévenként.">
  <title>8.-os Vizsga Guru</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f292d;
      --muted: #536268;
      --paper: #fff;
      --line: #dedfd6;
      --accent: #16695f;
      --accent-soft: #e5f2ef;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      color: var(--ink);
      background: #f7f5ef;
      font: 1rem / 1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(1060px, calc(100% - 32px));
      padding: 24px 0 56px;
      margin: auto;
    }

    a { color: var(--accent); text-underline-offset: .16em; }
    :is(a, button, summary):focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    header > a { font-size: .9rem; font-weight: 700; }
    h1, h2, h3, p { margin: 0; }
    h1 {
      margin: .28em 0 .16em;
      font: 800 clamp(2.3rem, 7vw, 4.5rem) / 1.03 Georgia, serif;
      letter-spacing: -.045em;
    }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.08rem; line-height: 1.35; }
    .intro, .empty p { color: var(--muted); }

    .year-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-top: 24px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .controls-label { font-size: .9rem; font-weight: 700; margin-right: 4px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: var(--paper);
      font: 700 .88rem / 1.3 system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-current="true"] {
      color: #10594f;
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    #year-summary { color: var(--muted); font-size: .9rem; }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 25px 0 10px;
    }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .topic-group, .empty {
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
    }
    .topic-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px 12px;
      padding: 14px 16px;
      border-radius: 15px;
      list-style: none;
      cursor: pointer;
    }
    .topic-group summary::-webkit-details-marker { display: none; }
    .topic-group summary:hover { background: #f5f8f5; }
    .topic-group summary::after {
      content: "+";
      grid-column: 2;
      grid-row: 1 / span 2;
      color: var(--accent);
      font-size: 1.3rem;
    }
    .topic-group[open] summary::after { content: "−"; }
    .group-name { font-weight: 750; line-height: 1.3; }
    .group-count { font-size: .82rem; color: var(--muted); }
    .topics { list-style: none; padding: 0 16px; margin: 0; }
    .topics li { padding: 10px 0; border-top: 1px solid var(--line); }
    .topic-name { display: flex; gap: 8px; font-weight: 650; line-height: 1.35; }
    .topic-code { flex: none; color: var(--muted); font-size: .85em; font-variant-numeric: tabular-nums; }
    .empty { margin-top: 22px; padding: 20px; }
    .empty p { margin-top: 6px; }

    @media (max-width: 660px) {
      .grid { grid-template-columns: 1fr; }
      .section-heading { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="../../index.html">← Nyolcadikos játékok</a>
      <h1>8.-os Vizsga Guru</h1>
      <p class="intro">A Radnóti nyolcadikos matematikavizsgájának témái tanévenként.</p>
    </header>

    <div class="year-bar">
      <nav class="controls" id="year-choices" aria-label="Vizsga tanéve">
        <span class="controls-label">Tanév</span>
      </nav>
      <p id="year-summary" role="status"></p>
    </div>

    <section id="year-content" aria-labelledby="topics-title">
      <div class="section-heading"><h2 id="topics-title">Vizsgatémák</h2></div>
      <div class="grid" id="topic-groups"></div>
    </section>

    <section class="empty" id="empty-year" aria-labelledby="empty-year-title" hidden>
      <h2 id="empty-year-title">Ehhez a tanévhez még nincs tematika</h2>
      <p>A korábbi tematikákat a tanévválasztóval nyithatod meg.</p>
    </section>
  </main>

  <script>
    const curricula = [
      { year: "2025-2026", groups: [
        {
          name: "Gondolkodási és megismerési módszerek",
          topics: [
            ["1.1", "Halmazok, halmazábrák és számhalmazok"],
            ["1.2", "Egyszerű állítások igazságtartalma"],
            ["1.3", "Sorbarendezés és leszámlálás"]
          ]
        },
        {
          name: "Algebra és számelmélet",
          topics: [
            ["2.1", "Aritmetika, hatványok, négyzetgyök és mértékegységek"],
            ["2.2", "Oszthatóság, prímtényezők, LNKO és LKKT"],
            ["2.3", "Arányosság és százalékszámítás"],
            ["2.4", "Elsőfokú egyenletek és egyenlőtlenségek"],
            ["2.5", "Szöveges feladatok"],
            ["2.6", "Algebrai kifejezések és szorzattá alakítás"]
          ]
        },
        {
          name: "Hozzárendelések, függvények",
          topics: [
            ["3.1", "Tájékozódás a koordináta-rendszerben"],
            ["3.2", "Grafikonok értelmezése"],
            ["3.3", "Függvények megadása"],
            ["3.4", "Lineáris függvények"]
          ]
        },
        {
          name: "Geometria",
          topics: [
            ["4.1", "Körzős-vonalzós szerkesztések"],
            ["4.2", "Tengelyes és középpontos tükrözés, szimmetria"],
            ["4.3", "Háromszögek, nevezetes vonalak és Pitagorasz"],
            ["4.4", "Négyszögek és sokszögek"],
            ["4.5", "Kör, kerület és terület"],
            ["4.6", "Térgeometria, felszín és térfogat"]
          ]
        }
      ] },
      { year: "2026-2027", groups: [] }
    ];

    const yearChoices = document.querySelector("#year-choices");
    const groupGrid = document.querySelector("#topic-groups");
    const summary = document.querySelector("#year-summary");
    const emptyYear = document.querySelector("#empty-year");
    const yearContent = document.querySelector("#year-content");

    function textElement(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text;
      return element;
    }

    const yearLinks = curricula.map(({ year }) => {
      const link = textElement("a", "chip", year.replace("-", "–"));
      link.setAttribute("href", `#vizsga-${year}`);
      yearChoices.append(link);
      return link;
    });

    function renderTopics(groups) {
      const openGroups = new Set([...groupGrid.querySelectorAll("details[open]")].map(group => group.dataset.group));
      const rendered = groups.map(group => {
        const details = document.createElement("details");
        details.className = "topic-group";
        details.dataset.group = group.name;
        details.open = openGroups.has(group.name);
        const label = document.createElement("summary");
        label.append(
          textElement("span", "group-name", group.name),
          textElement("span", "group-count", `${group.topics.length} témakör`)
        );
        const list = document.createElement("ul");
        list.className = "topics";
        for (const [code, name] of group.topics) {
          const item = document.createElement("li");
          const title = textElement("p", "topic-name", "");
          title.append(textElement("span", "topic-code", code), document.createTextNode(name));
          item.append(title);
          list.append(item);
        }
        details.append(label, list);
        return details;
      });
      groupGrid.replaceChildren(...rendered);
    }

    function render() {
      const index = Math.max(0, yearLinks.findIndex(link => link.hash === location.hash));
      const selected = yearLinks[index];
      const { groups } = curricula[index];
      for (const link of yearLinks) {
        if (link === selected) link.setAttribute("aria-current", "true");
        else link.removeAttribute("aria-current");
      }
      yearContent.hidden = groups.length === 0;
      emptyYear.hidden = groups.length > 0;
      summary.textContent = groups.length
        ? `${groups.reduce((total, group) => total + group.topics.length, 0)} vizsgatéma`
        : "";
      if (groups.length) renderTopics(groups);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
